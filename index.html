<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村鯖smp ステータスダッシュボード</title>
    
    <!-- グラフ用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    
    <!-- アイコン用ライブラリ (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 数字の縦スクロールアニメーション用ライブラリ (Odometer) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-minimal.min.css" />
    <script>
        // Odometerの設定（カンマ区切りを有効化）
        window.odometerOptions = {
            format: '(,ddd)'
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #b45309;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ヘッダー周りのデザイン */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }
        .header h1 { 
            margin: 0; 
            font-size: 28px; 
            color: var(--text-main); 
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: var(--accent-blue);
        }
        .header .update-time { 
            color: var(--text-muted); 
            font-size: 14px; 
            font-weight: 500; 
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* グリッドレイアウト */
        .grid-row-top {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .grid-row-main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        /* カードデザイン */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .card h2 .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* 指標（数字）周りのデザイン */
        .metric {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-main);
            margin: 10px 0 0 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .metric .unit { 
            font-size: 18px; 
            font-weight: 600; 
            color: var(--text-muted); 
        }
        .youtube-color { color: var(--accent-red); }
        .youtube-icon { color: var(--accent-red); }

        /* リンクボタン */
        .channel-link {
            font-size: 12px;
            background: #fee2e2;
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .channel-link:hover {
            background: #fecaca;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* テーブルデザイン */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th { color: var(--text-muted); font-size: 13px; font-weight: 700; }
        td { font-size: 15px; color: var(--text-main); font-weight: 600; }
        tr:last-child td { border-bottom: none; }

        .no-players { color: #94a3b8; font-size: 13px; font-weight: normal; }

        /* プレイヤーアバター */
        .player-avatar {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            image-rendering: pixelated;
            flex-shrink: 0;
            background-color: #e2e8f0; /* 画像読み込み前の背景色 */
        }

        /* 折りたたみリスト */
        .player-details { margin: 0; }
        .player-details summary {
            cursor: pointer;
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: 600;
            list-style: none;
            display: inline-flex;
            align-items: center;
            user-select: none;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .player-details summary:hover { background: #eff6ff; }
        .player-details summary::-webkit-details-marker { display: none; }
        .player-details summary::before {
            content: '\f0da'; /* FontAwesomeの右矢印 */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 12px;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }
        .player-details[open] summary::before { transform: rotate(90deg); }

        .player-list-vertical {
            margin: 12px 0 0 0; padding: 0;
            list-style-type: none;
            display: flex; flex-direction: column; gap: 6px;
        }
        .player-list-vertical li {
            background-color: var(--bg-color);
            padding: 8px 12px; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 10px;
        }

        /* ランキング */
        .ranking-list {
            list-style: none; padding: 0; margin: 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        .ranking-item {
            background-color: var(--bg-color);
            padding: 12px 16px; border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 14px;
        }
        .ranking-rank {
            font-weight: 800; font-size: 18px;
            width: 28px; text-align: center; color: var(--text-muted);
        }
        .ranking-rank.rank-1 { color: var(--gold); font-size: 22px; }
        .ranking-rank.rank-2 { color: var(--silver); font-size: 20px;}
        .ranking-rank.rank-3 { color: var(--bronze); font-size: 20px;}
        
        .ranking-name { font-weight: 700; font-size: 15px; }
        .ranking-time {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 14px; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-server"></i> 村鯖smp ダッシュボード</h1>
        <div class="update-time" id="last-updated">最終更新: 読み込み中...</div>
    </div>

    <!-- 上部のカード群 -->
    <div class="grid-row-top">
        <div class="card">
            <h2>
                <span class="title-left"><i class="fa-solid fa-users"></i> サーバー合計プレイヤー数</span>
            </h2>
            <div class="metric">
                <span id="total-players" class="odometer">0</span>
                <span class="unit">人</span>
            </div>
        </div>
        
        <div class="card">
            <h2>
                <span class="title-left"><i class="fa-brands fa-youtube youtube-icon"></i> YouTube登録者数</span>
                <a href="https://www.youtube.com/@village-smp" target="_blank" class="channel-link">
                    <span>チャンネルへ</span> <i class="fa-solid fa-up-right-from-square" style="font-size: 10px; width: auto;"></i>
                </a>
            </h2>
            <div class="metric youtube-color">
                <span id="youtube-sub-count" class="odometer">0</span>
                <span class="unit">人</span>
            </div>
        </div>

        <div class="card">
            <h2>
                <span class="title-left"><i class="fa-solid fa-memory"></i> 全体メモリ使用量</span>
            </h2>
            <div class="metric">
                <span id="ram-used" class="odometer">0</span>
                <span class="unit">/ <span id="ram-max">0</span> MB</span>
            </div>
        </div>
    </div>

    <div class="grid-row-main">
        <div class="card">
            <h2><span class="title-left"><i class="fa-solid fa-chart-bar"></i> サーバー別 接続人数</span></h2>
            <div class="chart-container">
                <canvas id="serverChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2><span class="title-left"><i class="fa-solid fa-list-ul"></i> サーバー詳細 ＆ プレイヤー一覧</span></h2>
            <table>
                <thead>
                    <tr>
                        <th>サーバー名</th>
                        <th>接続人数</th>
                        <th>プレイヤー</th>
                    </tr>
                </thead>
                <tbody id="server-table-body">
                    </tbody>
            </table>
        </div>

        <div class="card">
            <h2><span class="title-left"><i class="fa-solid fa-trophy"></i> プレイ時間トップ 5 (現在のセッション)</span></h2>
            <ul class="ranking-list" id="playtime-ranking-list">
                </ul>
        </div>

        <div class="card">
            <h2><span class="title-left"><i class="fa-solid fa-microchip"></i> プロキシ メモリ割り当て</span></h2>
            <div class="chart-container">
                <canvas id="ramChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);

    let serverChartInstance = null;
    let ramChartInstance = null;

    // ===== YouTube API 設定 =====
    const YOUTUBE_API_KEY = 'AIzaSyDPaAZ8OEVK3kRj8ixuJjGAE3ay7BvjXSU';
    const YOUTUBE_CHANNEL_ID = 'UCh-96GfwkBZGYwPxwq0yW2g'; 
    const YOUTUBE_API_URL = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${YOUTUBE_CHANNEL_ID}&key=${YOUTUBE_API_KEY}`;

    // デフォルトスティーブのアイコンURL (エラー時のフォールバック用)
    const DEFAULT_AVATAR_URL = 'https://minotar.net/avatar/MHF_Steve';

    async function fetchYouTubeStats() {
        try {
            const response = await fetch(YOUTUBE_API_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();

            if (data.items && data.items.length > 0) {
                const stats = data.items[0].statistics;
                document.getElementById('youtube-sub-count').innerHTML = stats.subscriberCount;
            } else {
                console.warn('YouTube channel not found.');
            }
        } catch (error) {
            console.error('YouTube Data fetch error:', error);
        }
    }

    async function fetchAndUpdateData() {
        try {
            const response = await fetch('./server-status.json?t=' + new Date().getTime());
            const data = await response.json();

            const date = new Date(data.last_updated);
            document.getElementById('last-updated').innerText = `最終更新: ${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2, '0')}/${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
            
            document.getElementById('total-players').innerHTML = data.total_players;
            document.getElementById('ram-used').innerHTML = data.ram_used_mb;
            document.getElementById('ram-max').innerHTML = data.ram_max_mb; 

            const serverNames = Object.keys(data.servers);
            const serverCounts = [];
            const tableBody = document.getElementById('server-table-body');
            tableBody.innerHTML = '';
            
            serverNames.forEach((name) => {
                const serverData = data.servers[name];
                const count = typeof serverData === 'object' ? serverData.count : serverData;
                const players = typeof serverData === 'object' && serverData.players ? serverData.players : [];
                serverCounts.push(count);

                let playerHtml = `<span class="no-players">オフライン / 誰もいません</span>`;
                if (count > 0) {
                    // onerrorで画像読み込み失敗時にデフォルトアイコンに切り替える処理を追加
                    const listItems = players.map(p => `
                        <li>
                            <img class="player-avatar" src="https://minotar.net/avatar/${p}/24" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR_URL}/24';" alt="${p}">
                            <span>${p}</span>
                        </li>
                    `).join('');
                    
                    playerHtml = `
                        <details class="player-details">
                            <summary>プレイヤーを表示</summary>
                            <ul class="player-list-vertical">
                                ${listItems}
                            </ul>
                        </details>
                    `;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${name}</td><td>${count} 人</td><td>${playerHtml}</td>`;
                tableBody.appendChild(tr);
            });

            const rankingList = document.getElementById('playtime-ranking-list');
            rankingList.innerHTML = '';
            
            if (data.playtimes && Object.keys(data.playtimes).length > 0) {
                const sortedPlayers = Object.entries(data.playtimes)
                    .sort(([, timeA], [, timeB]) => timeB - timeA)
                    .slice(0, 5);

                sortedPlayers.forEach(([pName, pTime], index) => {
                    const rank = index + 1;
                    const li = document.createElement('li');
                    li.className = 'ranking-item';
                    li.innerHTML = `
                        <span class="ranking-rank rank-${rank}">#${rank}</span>
                        <img class="player-avatar" src="https://minotar.net/avatar/${pName}/32" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR_URL}/32';" alt="${pName}" style="width:32px; height:32px; border-radius:6px;">
                        <span class="ranking-name">${pName}</span>
                        <span class="ranking-time">${pTime} 分</span>
                    `;
                    rankingList.appendChild(li);
                });
            } else {
                rankingList.innerHTML = '<li class="no-players" style="padding: 10px 0;">現在ログインしているプレイヤーはいません。</li>';
            }

            const ctxServer = document.getElementById('serverChart').getContext('2d');
            if (serverChartInstance) serverChartInstance.destroy();
            serverChartInstance = new Chart(ctxServer, {
                type: 'bar',
                data: {
                    labels: serverNames,
                    datasets: [{
                        label: 'プレイヤー数',
                        data: serverCounts,
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        datalabels: {
                            color: '#3b82f6',
                            anchor: 'end',
                            align: 'top',
                            font: { weight: 'bold', size: 14 },
                            formatter: (value) => value > 0 ? value + '人' : ''
                        }
                    },
                    scales: { 
                        y: { beginAtZero: true, suggestedMax: 10, ticks: { stepSize: 1 } } 
                    } 
                }
            });

            const freeRam = data.ram_max_mb - data.ram_used_mb;
            const ctxRam = document.getElementById('ramChart').getContext('2d');
            if (ramChartInstance) ramChartInstance.destroy();
            ramChartInstance = new Chart(ctxRam, {
                type: 'doughnut',
                data: {
                    labels: ['使用中', '空き'],
                    datasets: [{
                        data: [data.ram_used_mb, freeRam],
                        backgroundColor: ['#ef4444', '#10b981'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { size: 14 } } },
                        datalabels: {
                            color: '#ffffff',
                            font: { weight: 'bold', size: 14 },
                            formatter: (value) => value + ' MB'
                        }
                    }
                }
            });

        } catch (error) {
            console.error("Data fetch error:", error);
            document.getElementById('last-updated').innerText = "データの取得に失敗しました";
        }
    }

    fetchAndUpdateData();
    fetchYouTubeStats();
    
    setInterval(fetchAndUpdateData, 60000); 
    setInterval(fetchYouTubeStats, 60000); 
</script>
</body>
</html>
